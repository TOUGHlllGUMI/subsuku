<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サブスク帳</title>
<meta name="description" content="使っているサブスクを並べて、毎月と1年の合計金額を出すアプリ">
<meta name="theme-color" content="#f4f2ee">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="app">
  <header class="top">
    <h1 class="title">サブスク帳</h1>
    <p class="count" id="count"></p>
  </header>

  <section class="total" aria-label="合計金額">
    <p class="total-label">毎月</p>
    <p class="total-month" id="totalMonth">¥0</p>
    <p class="total-year">1年で <span id="totalYear">¥0</span></p>
    <div class="bar" id="bar" aria-hidden="true"></div>
    <p class="bar-note" id="barNote">色の帯は、毎月の金額の内訳です</p>
    <button class="rate" id="rateButton" type="button" hidden>
      <span id="rateText"></span>
      <span class="rate-change">変える</span>
    </button>
  </section>

  <div class="empty" id="empty" hidden>
    <p class="empty-main">まだ何も入っていません</p>
    <p class="empty-sub">下の「追加」から、使っているサブスクを入れてください。<br>年払いのものは、月あたりに直して合計します。</p>
  </div>

  <ul class="cards" id="cards"></ul>
</main>

<button class="add" id="addButton" type="button">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  追加
</button>

<div class="sheet-back" id="sheetBack" hidden>
  <form class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" novalidate>
    <h2 class="sheet-title" id="sheetTitle">サブスクを追加</h2>

    <label class="field">
      <span class="field-label">名前</span>
      <input id="fName" type="text" maxlength="30" autocomplete="off" placeholder="例: Netflix">
    </label>

    <div class="presets" id="presets" hidden>
      <div class="preset-list" id="presetList"></div>
      <p class="preset-note" id="presetNote"></p>
    </div>

    <div class="field">
      <span class="field-label">支払い</span>
      <div class="toggles">
        <div class="cycle" role="radiogroup" aria-label="支払いの間隔">
          <button type="button" class="cycle-btn" data-cycle="month" role="radio">毎月</button>
          <button type="button" class="cycle-btn" data-cycle="year" role="radio">毎年</button>
        </div>
        <div class="cycle" role="radiogroup" aria-label="通貨">
          <button type="button" class="cycle-btn" data-currency="jpy" role="radio">円</button>
          <button type="button" class="cycle-btn" data-currency="usd" role="radio">ドル</button>
        </div>
      </div>
    </div>

    <label class="field">
      <span class="field-label" id="priceLabel">1か月の金額</span>
      <span class="price">
        <span class="yen" id="priceMark">¥</span>
        <input id="fPrice" type="text" inputmode="numeric" autocomplete="off" placeholder="0">
      </span>
      <span class="field-hint" id="priceHint"></span>
    </label>

    <div class="field">
      <span class="field-label">色</span>
      <div class="swatches" id="swatches"></div>
    </div>

    <p class="error" id="formError" hidden></p>

    <div class="sheet-actions">
      <button type="button" class="btn-delete" id="deleteButton">削除</button>
      <span class="spacer"></span>
      <button type="button" class="btn-cancel" id="cancelButton">やめる</button>
      <button type="submit" class="btn-save">保存</button>
    </div>
  </form>
</div>

<div class="sheet-back" id="rateBack" hidden>
  <form class="sheet" id="rateSheet" role="dialog" aria-modal="true" aria-labelledby="rateTitle" novalidate>
    <h2 class="sheet-title" id="rateTitle">ドルの計算</h2>
    <p class="sheet-text" id="rateAutoText"></p>

    <label class="field">
      <span class="field-label">1ドルを何円で計算するか</span>
      <span class="price">
        <input id="fRate" type="text" inputmode="decimal" autocomplete="off">
        <span class="unit">円</span>
      </span>
      <span class="field-hint">自分で決めた数字にすると、自動では変わらなくなります</span>
    </label>

    <p class="error" id="rateError" hidden></p>

    <div class="sheet-actions">
      <button type="button" class="btn-auto" id="rateAutoButton">自動に戻す</button>
      <span class="spacer"></span>
      <button type="button" class="btn-cancel" id="rateCancelButton">やめる</button>
      <button type="submit" class="btn-save">保存</button>
    </div>
  </form>
</div>

<script src="calc.js"></script>
<script src="presets.js"></script>
<script src="app.js"></script>
</body>
</html>
